name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    name: Contracts and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Validate contracts and corpus files
        run: python scripts/validate_contracts.py
      - name: Tests
        run: pytest -q

  eval-scan:
    name: Eval, scan baseline on act-subset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -e ".[dev]"
          python -m playwright install --with-deps chromium
      - name: Fetch the pinned ACT test cases
        run: |
          commit=$(awk -F, '$1 == "w3c/wcag-act-rules" {print $2}' corpus/manifest.csv)
          dest=.corpus/w3c/wcag-act-rules
          git init -q "$dest"
          git -C "$dest" fetch -q --depth 1 https://github.com/w3c/wcag-act-rules.git "$commit"
          git -C "$dest" checkout -q FETCH_HEAD
      - name: Score the scan baseline
        run: kuebiko eval act-subset --baseline scan --out runs
      - name: Keep eval.json
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-scan-act-subset
          path: |
            runs/*/eval.json
            runs/*/cases.jsonl
          if-no-files-found: ignore
