# The release stage of the repository's Dockerfile. Upstream builds the frontend (dist/) on the host
# before `docker build` (extra/release/lib.mjs), so a one-shot service builds it into the checkout
# under .corpus/ and the app mounts it. Base images come from Docker Hub; the app code is the pinned checkout.
services:
  dist:
    image: node:26
    working_dir: /app
    volumes: ["./:/app"]
    entrypoint: ["sh", "-c", "npm ci && npm run build"]
  app:
    build: { context: ., dockerfile: docker/dockerfile, target: release }
    depends_on:
      dist: { condition: service_completed_successfully }
    volumes: ["./dist:/app/dist:ro"]
    ports: ["127.0.0.1:8103:3001"]
