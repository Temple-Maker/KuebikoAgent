[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kuebiko-agent"
version = "0.0.1"
description = "Finds accessibility barriers in web apps, proposes fixes as pull requests, and collects feedback from assistive-technology users."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
eval = [
    "anthropic>=2.14",
]

[project.scripts]
kuebiko = "kuebiko.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kuebiko"]

[tool.pytest.ini_options]
testpaths = ["tests", "evals/tests"]
